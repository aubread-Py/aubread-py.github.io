<!DOCTYPE html>
<html>
 <head>
<!-- cabecera del documento web -->
  <title>Mi primer documento web</title>
  <meta charset="utf-8"/>
  <meta name="author" content="Francesc Ricart"/>
 </head>
 <body>
<!-- cuerpo del documento web -->
  <p>El lenguaje HTML sirve para aportar contenido y estructura a un documento web</p>
  <p>El siguiente <em>texto</em> está en cursiva</p>
  <dir>El siguiente <strong>texto</strong> está en negrita. Este texto está separado</dir>
  <p>El siguiente <u>texto</u> está subrayado</p>
  <p>El siguiente <mark>texto</mark> está resaltado</p>
 </body>
</html>
